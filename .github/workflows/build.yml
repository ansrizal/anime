name: Build and Deploy Plugins

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Plugins
        env:
          DUBBINDO_PASSWORD: ${{ secrets.DUBBINDO_PASSWORD }}
          DUBBINDO_USERNAME: ${{ secrets.DUBBINDO_USERNAME }}
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon

      - name: Prepare Deployment Folder
        run: |
          mkdir -p deploy
          # Copy all generated .cs3 files
          find . -name "*.cs3" -exec cp {} deploy/ \;
          # Copy plugins.json and repo.json
          [ -f build/plugins.json ] && cp build/plugins.json deploy/ || cp plugins.json deploy/
          [ -f repo.json ] && cp repo.json deploy/

      - name: Deploy to Builds Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: builds
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Build: ${{ github.sha }}"
